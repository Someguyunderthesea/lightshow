<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stadium Light Show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Stadium Light Show</h1>
      <div id="controls">
        <label id="file-label" for="audio-file">Load File</label>
        <input type="file" id="audio-file" accept="audio/*">
        <button id="spotify-btn">Spotify</button>
        <button id="play-btn" disabled>Play</button>
        <button id="stop-btn" disabled>Stop</button>
        <div id="pattern-select">
          <label for="pattern">Pattern:</label>
          <select id="pattern">
            <option value="reactive">Frequency Reactive</option>
            <option value="wave">Wave</option>
            <option value="pulse">Beat Pulse</option>
            <option value="rainbow">Rainbow Sweep</option>
            <option value="strobe">Strobe</option>
          </select>
        </div>
        <div id="sensitivity-control">
          <label for="sensitivity">Sensitivity:</label>
          <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5">
        </div>
      </div>
      <div id="now-playing"></div>
    </header>
    <!-- Spotify Search Panel -->
    <div id="spotify-panel" class="panel hidden">
      <div class="panel-header">
        <h2>Spotify Search</h2>
        <button id="spotify-close" class="panel-close">&times;</button>
      </div>
      <div id="spotify-setup" class="panel-section">
        <p>Enter your <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">Spotify App</a> Client ID:</p>
        <div class="inline-form">
          <input type="text" id="spotify-client-id" placeholder="Client ID">
          <button id="spotify-auth-btn">Connect</button>
        </div>
        <p class="hint">Create a free app at the Spotify Developer Dashboard. Add <code id="redirect-uri-display"></code> as a Redirect URI.</p>
      </div>
      <div id="spotify-search" class="panel-section hidden">
        <div class="inline-form">
          <input type="text" id="spotify-query" placeholder="Search for a song...">
          <button id="spotify-search-btn">Search</button>
        </div>
        <div id="spotify-user-info"></div>
        <button id="spotify-logout-btn" class="link-btn">Logout</button>
      </div>
      <div id="spotify-results"></div>
      <div id="spotify-notice" class="hint">Spotify provides 30-second preview clips for visualization.</div>
    </div>

    <canvas id="stadium"></canvas>
  </div>
  <script src="spotify.js"></script>
  <script src="audio.js"></script>
  <script src="stadium.js"></script>
  <script src="patterns.js"></script>
  <script src="main.js"></script>
</body>
</html>
